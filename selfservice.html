<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zelfservice bestellen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* Zelfservice gebruikt dezelfde restaurant-huisstijl als restaurant.html. */
.selfservice-wrap { max-width: 680px; }
.selfservice-top { align-items: baseline; }
.selfservice-subtitle { color: var(--muted); font-size: .82rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.selfservice-tabs { display:flex; gap:6px; margin-bottom:24px; overflow-x:auto; border-bottom:1px solid var(--line); }
.selfservice-tab { flex:0 0 auto; background:transparent; border:0; border-bottom:2px solid transparent; color:var(--muted); font-family:var(--font-body); font-weight:600; font-size:.85rem; padding:12px 14px; cursor:pointer; white-space:nowrap; }
.selfservice-tab:hover { color:var(--gold-soft); background:linear-gradient(180deg, rgba(201,162,75,.06), transparent); }
.selfservice-tab.active { color:var(--gold-soft); border-bottom-color:var(--gold); background:linear-gradient(180deg, rgba(201,162,75,.1), transparent); }
.selfservice-card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin:0 0 12px; animation:fadeSlideUp .25s ease both; }
.selfservice-card h2 { font-family:var(--font-display); color:var(--gold-soft); font-size:1.08rem; margin:0 0 14px; }
.selfservice-muted { color:var(--muted); }
.selfservice-tables { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px; }
.selfservice-table { padding:13px 10px; border:1px solid var(--line); background:var(--bg-elevated); color:var(--ink); border-radius:var(--radius); cursor:pointer; font:600 .88rem var(--font-body); }
.selfservice-table:hover { border-color:var(--gold); color:var(--gold-soft); }
.selfservice-table.active { border-color:var(--gold); background:rgba(201,162,75,.12); color:var(--gold-soft); box-shadow:0 0 0 1px rgba(201,162,75,.15); }
.selfservice-products { display:grid; gap:9px; }
.selfservice-product { border:1px solid var(--line); background:var(--bg-elevated); border-radius:var(--radius); padding:14px; }
.selfservice-prodtop { display:flex; justify-content:space-between; gap:12px; align-items:center; }
.selfservice-product .price { color:var(--gold-soft); font-family:var(--font-mono); font-weight:700; white-space:nowrap; }
.selfservice-stepper { display:flex; align-items:center; gap:12px; margin-top:12px; }
.selfservice-stepper button { width:36px; height:36px; border:1px solid var(--line); border-radius:50%; background:transparent; color:var(--gold-soft); font-size:20px; cursor:pointer; }
.selfservice-stepper button:hover { border-color:var(--gold); background:rgba(201,162,75,.08); }
.selfservice-stepper button:disabled { opacity:.35; cursor:not-allowed; }
.selfservice-option { margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; }
.selfservice-option button, .selfservice-option-button { border:1px solid var(--line); background:transparent; color:var(--muted); border-radius:var(--radius-pill); padding:7px 11px; font:600 .78rem var(--font-body); cursor:pointer; }
.selfservice-option button:hover, .selfservice-option-button:hover { border-color:var(--gold); color:var(--gold-soft); }
.selfservice-option button.active, .selfservice-option-button.active { background:rgba(201,162,75,.14); border-color:var(--gold); color:var(--gold-soft); }
.selfservice-note { width:100%; min-height:88px; box-sizing:border-box; padding:11px 12px; border:1px solid var(--line); border-radius:var(--radius); background:var(--bg-elevated); color:var(--ink); font:500 .9rem var(--font-body); resize:vertical; outline:none; }
.selfservice-note:focus { border-color:var(--gold); box-shadow:0 0 0 2px rgba(201,162,75,.08); }
.selfservice-note::placeholder { color:var(--muted); }
.selfservice-send { width:100%; margin-top:12px; border-radius:var(--radius-pill); border:1px solid var(--gold); background:linear-gradient(180deg,var(--gold-soft) 0%,var(--gold) 60%,#b8913f 100%); color:var(--bg); padding:11px 16px; font:700 .85rem var(--font-body); cursor:pointer; }
.selfservice-send:hover { filter:brightness(1.06); }
.selfservice-send:disabled { opacity:.5; cursor:not-allowed; }
.selfservice-status { font-weight:700; color:var(--gold-soft); }
.selfservice-progress { height:7px; background:var(--bg); border:1px solid var(--line); border-radius:var(--radius-pill); overflow:hidden; margin:10px 0; }
.selfservice-progress div { height:100%; background:linear-gradient(90deg,var(--gold),var(--gold-soft)); transition:width .25s ease; }
.selfservice-error { color:#d99a9a; font-weight:600; font-size:.82rem; min-height:18px; margin-top:8px; }
.selfservice-small { font-size:.78rem; }
.selfservice-hidden { display:none !important; }
@media (max-width:520px) { .selfservice-tables { grid-template-columns:repeat(2,minmax(0,1fr)); } .selfservice-wrap { padding-left:14px; padding-right:14px; } }
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="firebase-config.js"></script>
</head>
<body>
<div class="wrap selfservice-wrap">
<header class="top selfservice-top"><div class="top-title-group"><h1 id="restaurant-name">Restaurant</h1><span class="selfservice-subtitle">📱 Zelfservice</span></div></header>
<div id="error" class="selfservice-error"></div>
<div id="app" class="selfservice-hidden">
<div class="selfservice-tabs">
<button id="tab-order" class="selfservice-tab active">🛒 Bestellen</button>
<button id="tab-mine" class="selfservice-tab">📦 Mijn bestellingen</button>
</div>
<section id="order-view">
<div class="selfservice-card"><h2>1. Kies je tafel</h2><div id="tables" class="selfservice-tables"></div></div>
<div class="selfservice-card"><h2>2. Kies je producten</h2><div id="products" class="selfservice-products"></div></div>
<div class="selfservice-card"><h2>3. Extra opmerking</h2><textarea id="note" class="selfservice-note" placeholder="Bijvoorbeeld: graag zonder ijs"></textarea><button id="send" class="selfservice-send">Bestelling naar de keuken sturen</button><div id="send-error" class="selfservice-error"></div></div>
</section>
<section id="mine-view" class="selfservice-hidden"><div id="mine"></div></section>
</div>
</div>
<script src="selfservice.js"></script>
</body>
</html>
