<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zelfservice bestellen</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5;color:#222}.wrap{max-width:720px;margin:auto;padding:18px}
header{background:#222;color:#fff;border-radius:16px;padding:22px;margin-bottom:14px}h1{margin:0 0 6px}.muted{color:#777}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button,.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.tabs button.active{background:#222;color:#fff}.btn{background:#222;color:#fff;width:100%;margin-top:12px}.btn:disabled{opacity:.5}.card{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #00000012}.tables{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.table{padding:14px;border:2px solid #ddd;background:#fff;border-radius:12px;cursor:pointer}.table.active{border-color:#222;background:#eee}.products{display:grid;gap:10px}.product{border:1px solid #ddd;border-radius:12px;padding:12px}.prodtop{display:flex;justify-content:space-between;gap:8px}.stepper{display:flex;align-items:center;gap:12px;margin-top:10px}.stepper button{width:38px;height:38px;border:0;border-radius:9px;font-size:20px}.option{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}.option button{border:1px solid #ccc;background:#fff;border-radius:20px;padding:7px 10px}.option button.active{background:#222;color:#fff}.note{width:100%;box-sizing:border-box;min-height:80px;padding:10px;border:1px solid #ccc;border-radius:10px;resize:vertical}.status{font-weight:700}.progress{height:8px;background:#eee;border-radius:8px;overflow:hidden;margin:10px 0}.progress div{height:100%;background:#222}.error{color:#b00020;font-weight:600}.hidden{display:none}.small{font-size:13px}.price{font-weight:700}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="firebase-config.js"></script>
</head>
<body>
<div class="wrap">
<header><h1 id="restaurant-name">Restaurant</h1><div>📱 Zelfservice bestellen</div></header>
<div id="error" class="error"></div>
<div id="app" class="hidden">
<div class="tabs">
<button id="tab-order" class="active">🛒 Bestellen</button>
<button id="tab-mine">📦 Mijn bestellingen</button>
</div>
<section id="order-view">
<div class="card"><h2>1. Kies je tafel</h2><div id="tables" class="tables"></div></div>
<div class="card"><h2>2. Kies je producten</h2><div id="products" class="products"></div></div>
<div class="card"><h2>3. Extra opmerking</h2><textarea id="note" class="note" placeholder="Bijvoorbeeld: graag zonder ijs"></textarea><button id="send" class="btn">Bestelling naar de keuken sturen</button><div id="send-error" class="error"></div></div>
</section>
<section id="mine-view" class="hidden"><div id="mine"></div></section>
</div>
</div>
<script src="selfservice.js"></script>
</body>
</html>
